[project]
name = "undertone-lab"
version = "1.0.0"
description = "REST API, analysis core and data pipeline of Undertone Lab, a diplomatic language analyzer"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "psycopg[binary]>=3.2",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "requests>=2.32",
    "sqlalchemy>=2.0.40",
    "vadersentiment>=3.3.2",
]

[project.optional-dependencies]
# Context-aware sentence classifier. Local use only: far too large for a serverless function.
context = ["transformers>=4.50", "torch>=2.6"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pycountry>=24.6",
    "pytest>=8.4",
    "ruff>=0.12",
    "uvicorn[standard]>=0.35",
]

[tool.uv]
# Only resolve releases that have been public for a while (supply-chain hygiene).
exclude-newer = "2026-10-08T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
